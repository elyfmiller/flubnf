# The priors: one line per fitted (__FREE) parameter, the range the filter
# draws it from. uniform_var spreads evenly between the two numbers;
# loguniform_var evenly on a log scale, for a value that could be 0.2 or 5.
# Keep each range to the values you find plausible for your pathogen: a
# range far wider than that spends particles where the data rule them out.
uniform_var = Reff__FREE 0.8 3.0
loguniform_var = mult__FREE 0.2 5.0
loguniform_var = r__FREE 0.1 40.0
# the model output whose weekly increment is the count in data.exp
pf_cumulative_observable = Hobs
