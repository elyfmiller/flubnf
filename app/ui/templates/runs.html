{% extends "base.html" %}{% block title %}FluBNF — runs{% endblock %}{% block content %}
<h1>Run ledger</h1>
<div class="card">
<table><tr><th>run</th><th>status</th><th>outcome</th></tr>
{% for r in ledger %}
 <tr><td><a href="/runs/{{ r.run_id }}"><code>{{ r.run_id }}</code></a></td>
 <td><span class="pill {% if r.status == 'ok' %}ok{% elif r.status == 'running' %}warn{% else %}bad{% endif %}">{{ r.status }}</span></td>
 <td style="max-width:34rem;overflow:hidden;text-overflow:ellipsis">{{ r.outcome }}</td></tr>
{% else %}<tr><td colspan="3" class="hint">no runs yet</td></tr>{% endfor %}
</table></div>
{% endblock %}
