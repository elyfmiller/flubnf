edition = 2
bng_command = {BNG}
model: m.bngl
bngl_backend = bngsim
output_dir = out
job_type = lwf
noise_model = neg_bin, dispersion = fit r__FREE, location = mean
noise_model Hobs = neg_bin, dispersion = fit r__FREE, location = mean, cumulative
experiment: Alaska_flu, data: Alaska_flu.exp
uniform_var = Reff__FREE 0.6 2.5
uniform_var = eps1__FREE 0.0 1.0
uniform_var = phi1__FREE 0.0 52.0
loguniform_var = mult__FREE 0.002 1.0
loguniform_var = r__FREE 0.1 40.0
initialization = rand
lwf_particles = 10000
lwf_jitter = 0.15
lwf_bounds = reflect
lwf_forecast_intervals = 4
lwf_resample_threshold = 0.5
random_seed = 1736257424
