name: tests
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python-version: ["3.11", "3.12"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install -e ".[app,dev]" bionetgen
      # No FluSight hub clone and no BNG in CI: hub-dependent and
      # engine-dependent tests skip themselves via flubnf.settings checks.
      - run: FLUBNF_HUB=/nonexistent pytest tests/ app/tests/ -q
