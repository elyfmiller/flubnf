name: tests
on:
  # dev too: its Windows launcher changes get the Windows jobs before a PR.
  push: {branches: [main, dev]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # ~4x the usual 5 minutes: a fuse against hangs (every job has one).
    timeout-minutes: 20
    strategy:
      matrix: {python-version: ["3.11", "3.12"]}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "${{ matrix.python-version }}"}
      # ruff: test_ui_layout.py lints app/ui with it (the case skips without it)
      - run: pip install -e ".[app,dev]" bionetgen ruff
      # No hub, no engine: dependent tests skip; --durations is the windows baseline.
      - name: tests (failures become annotations)
        run: |
          set -o pipefail
          FLUBNF_HUB=/nonexistent pytest tests/ app/tests/ -ra -o addopts="" \
            --durations=25 --durations-min=1.0 | tee pytest.out || {
            grep -E "^(FAILED|ERROR)" pytest.out | head -20 | while read -r line; do
              echo "::error::${line}"
            done
            # a collection crash prints no summary lines: surface the tail
            if ! grep -qE "^(FAILED|ERROR)" pytest.out; then
              tail -n 40 pytest.out | while read -r line; do
                echo "::error::${line}"
              done
            fi
            { echo "## pytest tail (${{ runner.os }}, py${{ matrix.python-version }})";
              echo '```'; tail -n 60 pytest.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      # if: always(): the table matters most on red runs.
      - name: where the time went
        if: always()
        run: |
          if [ ! -f pytest.out ]; then
            echo "no pytest.out: the suite produced no transcript to read"
            exit 0
          fi
          { echo "## slowest tests (${{ runner.os }}, py${{ matrix.python-version }})";
            echo '```';
            awk '/slowest .* durations/{f=1} /short test summary/{f=0} f' pytest.out |
              head -n 40;
            # the total: the awk range drops it on failed runs
            tail -n 1 pytest.out;
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # BNG2.pl for real (bng-linux, the runner's perl) on every shipped
      # example and under the folder names that broke it; every other test
      # fakes it. One leg: BNG2.pl is Perl, the Python version changes nothing.
      - name: the real BioNetGen (app/tests/test_real_bng.py)
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        env: {FLUBNF_BNG_REAL: "1", FLUBNF_HUB: /nonexistent}
        run: pytest app/tests/test_real_bng.py -ra -o addopts=""

      # The public engine's lock, engine-requirements.txt, read through
      # scripts/engine_lock.py as the installers read it, fetched as Windows
      # wheels for Python 3.12 and checked against the lock's hashes: a pin
      # that loses its win_amd64 wheel, or a hash that does not match, fails
      # here, not on a student's PC. The PyBNF wheel's line is left out (pure
      # Python, on a release page; the installers' check covers it). pip
      # reads environment markers on this runner, so a Windows-only
      # dependency missing from the lock is not caught here. Until the engine
      # lane posts the lock there is nothing to check, and the step says so.
      - name: the engine's pins have Windows wheels
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        run: |
          if [ ! -f engine-requirements.txt ]; then
            echo "::notice::engine-requirements.txt is not on this branch yet: no engine pins to check"
            exit 0
          fi
          python scripts/engine_lock.py deps engine-requirements.txt > "$RUNNER_TEMP/engine-pins.txt"
          cat "$RUNNER_TEMP/engine-pins.txt"
          pip download --disable-pip-version-check --dest "$RUNNER_TEMP/win-wheels" \
            --platform win_amd64 --only-binary=:all: --python-version 3.12 \
            --require-hashes -r "$RUNNER_TEMP/engine-pins.txt"

  # Required, like the ubuntu job: a red Windows leg fails the run.
  test-windows:
    name: "test-windows"
    runs-on: windows-latest
    env: {PYTHONUTF8: "1"}
    # A fuse above the worst run (71 min); lower it once the hour is explained.
    timeout-minutes: 90
    strategy:
      # both legs run to completion: they are compared
      fail-fast: false
      matrix: {python-version: ["3.11", "3.12"]}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "${{ matrix.python-version }}"}

      - run: pip install -e ".[app,dev]" bionetgen ruff
      # As ubuntu (Git Bash keeps the pipeline identical); --durations vs ubuntu's locates the hour.
      - name: tests (failures become annotations)
        shell: bash
        run: |
          set -o pipefail
          FLUBNF_HUB=/nonexistent pytest tests/ app/tests/ -ra -o addopts="" \
            --durations=25 --durations-min=1.0 | tee pytest.out || {
            grep -E "^(FAILED|ERROR)" pytest.out | head -20 | while read -r line; do
              echo "::error::${line}"
            done
            # a collection crash prints no summary lines: surface the tail
            if ! grep -qE "^(FAILED|ERROR)" pytest.out; then
              tail -n 40 pytest.out | while read -r line; do
                echo "::error::${line}"
              done
            fi
            { echo "## pytest tail (${{ runner.os }}, py${{ matrix.python-version }})";
              echo '```'; tail -n 60 pytest.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      # if: always(): the table matters most on red runs.
      - name: where the time went
        if: always()
        shell: bash
        run: |
          if [ ! -f pytest.out ]; then
            echo "no pytest.out: the suite produced no transcript to read"
            exit 0
          fi
          { echo "## slowest tests (${{ runner.os }}, py${{ matrix.python-version }})";
            echo '```';
            awk '/slowest .* durations/{f=1} /short test summary/{f=0} f' pytest.out |
              head -n 40;
            # the total: the awk range drops it on failed runs
            tail -n 1 pytest.out;
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # BNG2.pl for real (bng-win, Cygwin's run_network.exe) under the perl
      # the console resolves. pwsh, not Git Bash: Git Bash puts Git's MSYS
      # perl first on PATH, which the module sets up as a case of its own.
      # The runner must resolve Strawberry Perl, the perl students are given.
      - name: the real BioNetGen with Strawberry Perl (app/tests/test_real_bng.py)
        if: ${{ !cancelled() }}
        shell: pwsh
        env: {FLUBNF_BNG_REAL: "1", FLUBNF_HUB: /nonexistent}
        run: |
          $first = (Get-Command perl -ErrorAction SilentlyContinue).Source
          $perl = python -c "from flubnf.settings import resolve_perl; print(resolve_perl())"
          Write-Host "perl first on PATH: $first"
          Write-Host "perl FluBNF resolves: $perl"
          if ($perl -notlike '*\Strawberry\*') {
            Write-Host "::error::FluBNF resolves $perl, not Strawberry Perl, so the BNG2.pl runs below would not use the perl students are given"
            exit 1
          }
          pytest app/tests/test_real_bng.py -ra -o addopts=""

      # A record, not a gate (N1): does bngsim open a .net file in a folder
      # whose name is outside ASCII? Read from its source, it opens the path
      # as narrow (ANSI) bytes, which a relative pf.conf cannot help with.
      # Each load is printed and kept in the run's summary, a failed one as a
      # warning too. The step ends green whatever bngsim did: Windows CI is
      # required (docs/WINDOWS.md), so a red record would fail the run.
      - name: "record: bngsim loads a .net under a non-ASCII folder (N1)"
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "bngsim==0.15.1"
          $probe = @'
          import locale, os, shutil, tempfile
          from pathlib import Path
          import bionetgen, bngsim
          from app.core import sandbox as sb
          from flubnf import settings
          root = Path(tempfile.gettempdir()) / "flubnf-n1"
          shutil.rmtree(root, ignore_errors=True)
          plain = root / "plain"
          plain.mkdir(parents=True)
          shutil.copy(sb.EXAMPLES / "sir_example" / "model.bngl", plain / "m.bngl")
          # the network as a Sandbox run makes it, with FluBNF's own BNG2.pl run
          sb.BNG = str(Path(bionetgen.__file__).parent
                       / settings.bng_platform_dirs()[0] / "BNG2.pl")
          sb._netgen(plain)
          head = f"bngsim {bngsim.__version__}, ANSI code page {locale.getencoding()}"
          print(head)
          rows = []
          for name in ("plain", "Jos\u00e9", "\u0141ukasz \u674e"):
              d = root / name
              d.mkdir(exist_ok=True)
              if name != "plain":
                  shutil.copy(plain / "m.net", d / "m.net")
              for form, arg in (("absolute", str(d / "m.net")), ("relative", "m.net")):
                  os.chdir(d if form == "relative" else root)
                  try:
                      m = bngsim.Model.from_net(arg)
                      said = f"loaded, {m.n_species} species, {m.n_reactions} reactions"
                  except Exception as e:
                      said = f"{type(e).__name__}: {e}"[:300]
                      print(f"::warning title=N1 bngsim::{name}, {form} path: {said}")
                  rows.append((name, form, said))
                  print(f"{name} ({form} path): {said}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"## N1: {head}\n\n| folder | path | Model.from_net |\n|---|---|---|\n")
              f.writelines(f"| {n} | {p} | {s.replace('|', '/')} |\n" for n, p, s in rows)
          '@
          $probe | python -
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning title=N1 bngsim::the record did not finish (exit $LASTEXITCODE); the output above says why"
          }
          exit 0

  # FluBNF's own Perl as a student with no Perl and no administrator gets
  # it. Strawberry is hidden first. FluBNF.bat's Perl block then runs
  # through cmd with the real download, Windows' own tar.exe and a profile
  # folder named with a space, an apostrophe and parentheses
  # (tests/test_windows_own_perl.py). With LOCALAPPDATA pointing there, the
  # console must resolve that perl, the real BNG2.pl must run under it
  # (app/tests/test_real_bng.py), and bngsim must run a fit's calls with
  # code generation off and no C compiler on PATH, as every Windows runner
  # does (app/tests/test_bngsim_no_codegen.py).
  windows-own-perl:
    name: "windows-own-perl"
    runs-on: windows-latest
    env: {PYTHONUTF8: "1"}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -e ".[app,dev]" bionetgen "numpy<2" "bngsim==0.15.1"
      - name: hide every Windows Perl on the image
        shell: pwsh
        run: |
          if (Test-Path C:\Strawberry) { Rename-Item C:\Strawberry C:\Strawberry.hidden }
          $p = python -c "from flubnf.settings import resolve_perl; print(resolve_perl())"
          Write-Host "perl FluBNF resolves with Strawberry hidden: $p"
          if ($p -ne "None") {
            Write-Host "::error::a Windows perl is still found ($p), so this job would not test FluBNF's own"
            exit 1
          }
          # a record: the Server image's tar may have bzip2 built in; Windows 10's does not
          & "$env:SystemRoot\System32\tar.exe" --version
      - name: FluBNF.bat installs its own Perl (tests/test_windows_own_perl.py)
        shell: pwsh
        run: |
          $local = Join-Path $env:RUNNER_TEMP "Jane O'Brien (Lab)\AppData\Local"
          "FLUBNF_PERL_LOCAL=$local" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $env:FLUBNF_PERL_LOCAL = $local
          $env:FLUBNF_PERL_REAL = "1"
          pytest tests/test_windows_own_perl.py -ra -s -o addopts=""
      - name: the real BioNetGen and bngsim under FluBNF's own Perl
        shell: pwsh
        env: {FLUBNF_BNG_REAL: "1", FLUBNF_BNGSIM_REAL: "1", FLUBNF_HUB: /nonexistent}
        run: |
          $env:LOCALAPPDATA = $env:FLUBNF_PERL_LOCAL
          $perl = python -c "from flubnf.settings import resolve_perl; print(resolve_perl())"
          Write-Host "perl FluBNF resolves: $perl"
          if ($perl -notlike "*\FluBNF\perl\Library\bin\perl.exe") {
            Write-Host "::error::FluBNF resolves $perl, not its own Perl"
            exit 1
          }
          pytest app/tests/test_real_bng.py app/tests/test_bngsim_no_codegen.py -ra -o addopts=""

  # The only automated run of setup.ps1, under Windows
  # PowerShell 5.1 launched from cmd as FluBNF.bat does. One run per machine
  # state: 1 no fetch/probe; 2 real sparse clone + real fork probe (no
  # credentials by design, so the engine is always missing and setup must
  # still exit 0); 3 idempotent re-run; 4 a by-hand --sparse clone must be
  # widened; 5 a legacy Documents checkout is reused in place.
  # Not covered here: winget/Perl, the probe timeout, non-ASCII paths, the
  # no-git branch. test-windows runs FluBNF.bat's blocks as cmd slices with
  # stand-in programs (tests/test_windows_launcher.py: update, engine file,
  # :sync, moved .venv, the Perl offer, the engine venv), and the real
  # BNG2.pl under Strawberry Perl and awkward folder names
  # (app/tests/test_real_bng.py). A real winget, a real engine venv build and
  # a real fit run in no job.
  windows-setup-script:
    name: "windows-setup-script"
    runs-on: windows-latest
    # above the per-step budgets' sum, so a hang is blamed on its step
    timeout-minutes: 60
    steps:
      # .gitattributes checks out *.ps1/*.bat as CRLF, the bytes users get.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}

      - name: setup.ps1 parses under Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host "host: $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))"
          $tokens = $null
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path .\setup.ps1).Path, [ref]$tokens, [ref]$errs)
          if ($errs -and $errs.Count -gt 0) {
            foreach ($e in $errs) {
              Write-Host "::error::setup.ps1 line $($e.Extent.StartLineNumber): $($e.Message)"
            }
            exit 1
          }
          Write-Host "setup.ps1 parsed clean"
          exit 0

      - name: "run 1 of 5: no data fetch, no fork probe"
        shell: cmd
        timeout-minutes: 10
        env:
          FLUBNF_NO_DATA: "1"
          FLUBNF_NO_PROBE: "1"
        run: |
          rem FLUBNF_HUB unset: the %LOCALAPPDATA% default, no legacy folder. -NoPrompt here, omitted in run 2.
          set "LOG=%RUNNER_TEMP%\setup-run1.log"
          powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1 -NoPrompt > "%LOG%" 2>&1
          set CODE=%ERRORLEVEL%
          type "%LOG%"
          echo ---- setup.ps1 exit code: %CODE% ----
          if not "%CODE%"=="0" echo ::error::setup.ps1 exited %CODE%. A setup that COMPLETED with externals missing must exit 0; only a setup that broke may exit non-zero, or FluBNF.bat reports a problem on every healthy first run.
          if not "%CODE%"=="0" exit /b 1
          if not exist ".venv\Scripts\flubnf.exe" echo ::error::setup.ps1 exited 0 but left no .venv\Scripts\flubnf.exe, so the console cannot start
          if not exist ".venv\Scripts\flubnf.exe" exit /b 1
          exit /b 0

      - name: "run 1: the transcript is honest about what it skipped"
        shell: powershell
        run: |
          $path = Join-Path $env:RUNNER_TEMP "setup-run1.log"
          # Whitespace stripped both sides: PS 5.1 wraps host output mid-word.
          $raw = Get-Content $path -Raw
          if (-not $raw) { Write-Host "::error::run 1: the transcript at $path is empty, so setup.ps1 printed nothing at all"; exit 1 }
          $flat = $raw -replace '\s', ''
          function Has($needle) { $flat.Contains(($needle -replace '\s', '')) }
          $must = @(
            "data skipped (FLUBNF_NO_DATA=1)",
            "access probe skipped (FLUBNF_NO_PROBE=1)",
            # the default data location is under %LOCALAPPDATA%, not Documents
            "AppData\Local\FluBNF\FluSight-forecast-hub",
            "controlled folder access",
            "flubnf installed editable",
            "(read by FluBNF.bat on every launch)",
            "engine venv not ready",
            "PRIVATE repository",
            "Without the engine: the console, analogue engine, and reports all work.",
            "some externals missing"
          )
          $mustNot = @(
            "all externals present",
            "git clone failed",
            "hub data ready",
            # nothing at the old location, so no Documents path may appear
            "Documents\GitHub\FluSight-forecast-hub",
            "Reusing folders that are already on this machine"
          )
          $bad = @()
          foreach ($n in $must)    { if (-not (Has $n)) { $bad += "MISSING from the transcript: $n" } }
          foreach ($n in $mustNot) { if (Has $n)        { $bad += "PRESENT but must not be: $n" } }
          if ($bad.Count -gt 0) {
            foreach ($b in $bad) { Write-Host "::error::run 1: $b" }
            exit 1
          }
          Write-Host "run 1 transcript: all $($must.Count + $mustNot.Count) checks passed"
          exit 0

      - name: "run 1: the launcher configuration is written and callable from cmd"
        shell: cmd
        run: |
          if not exist ".flubnf.env.cmd" echo ::error::setup.ps1 did not write .flubnf.env.cmd, so FluBNF.bat would launch with no settings at all
          if not exist ".flubnf.env.cmd" exit /b 1
          type ".flubnf.env.cmd"
          call ".flubnf.env.cmd"
          if not defined FLUBNF_HUB echo ::error::.flubnf.env.cmd did not set FLUBNF_HUB
          if not defined FLUBNF_HUB exit /b 1
          echo FLUBNF_HUB=%FLUBNF_HUB%
          rem no space before the pipe (it would defeat /e); tail of the path only
          echo %FLUBNF_HUB%|findstr /e /i /c:"\AppData\Local\FluBNF\FluSight-forecast-hub" >nul
          set FOUND=%ERRORLEVEL%
          if not "%FOUND%"=="0" echo ::error::.flubnf.env.cmd points somewhere unexpected. With no FLUBNF_HUB set and no checkout at the old Documents location it must record the default under %%LOCALAPPDATA%%, which Controlled Folder Access does not protect.
          if not "%FOUND%"=="0" exit /b 1
          exit /b 0

      - name: "run 2 of 5: the REAL FluSight sparse clone"
        shell: cmd
        timeout-minutes: 20
        env:
          FLUBNF_HUB: ${{ runner.temp }}\flusight-hub
          # no FLUBNF_NO_DATA / FLUBNF_NO_PROBE: the real fetch and the real probe
        run: |
          rem no -NoPrompt: the script must detect the non-interactive session itself
          set "LOG=%RUNNER_TEMP%\setup-run2.log"
          powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1 > "%LOG%" 2>&1
          set CODE=%ERRORLEVEL%
          type "%LOG%"
          echo ---- setup.ps1 exit code: %CODE% ----
          if not "%CODE%"=="0" echo ::error::setup.ps1 exited %CODE% after the data fetch. A completed setup with only the engine missing must exit 0.
          if not "%CODE%"=="0" exit /b 1
          exit /b 0

      - name: "run 2: what git did on disk and what setup.ps1 said must agree"
        shell: powershell
        env:
          FLUBNF_HUB: ${{ runner.temp }}\flusight-hub
        run: |
          $path = Join-Path $env:RUNNER_TEMP "setup-run2.log"
          $raw = Get-Content $path -Raw
          if (-not $raw) { Write-Host "::error::run 2: the transcript at $path is empty, so setup.ps1 printed nothing at all"; exit 1 }
          $flat = $raw -replace '\s', ''
          function Has($needle) { $flat.Contains(($needle -replace '\s', '')) }
          $hub = $env:FLUBNF_HUB
          $onDisk = Test-Path (Join-Path $hub ".git")
          $claimed = Has "hub data ready (sparse)"
          # the field bug: disk and transcript must agree, both directions
          if ($onDisk -and -not $claimed) {
            Write-Host "::error::run 2: the clone SUCCEEDED on disk but setup.ps1 did not report success. This is the field bug reproduced: a fetch that worked, reported as a failure."
            exit 1
          }
          if ($claimed -and -not $onDisk) {
            Write-Host "::error::run 2: setup.ps1 reported the hub as ready but there is no $hub\.git. A failure reported as success is worse than the bug this replaced."
            exit 1
          }
          if (-not $onDisk) {
            Write-Host "::error::run 2: no clone. setup.ps1 produced no $hub\.git. The words git actually printed are in the transcript above, which is the point of no longer discarding them."
            exit 1
          }
          $bad = @()
          # the sparse cone: the four directories the app reads
          foreach ($d in @("auxiliary-data", "target-data",
                           "model-output\FluSight-baseline",
                           "model-output\FluSight-ensemble")) {
            if (-not (Test-Path (Join-Path $hub $d))) {
              $bad += "the sparse checkout is missing $d, which the app reads"
            }
          }
          $must = @(
            "hub data ready (sparse)",
            "engine venv not ready",
            "PRIVATE repository",
            "some externals missing"
          )
          $mustNot = @(
            "git clone failed",
            "all externals present",
            "access probe skipped",
            # the "yes" branch: this job holds no credentials
            "no invitation needed"
          )
          foreach ($n in $must)    { if (-not (Has $n)) { $bad += "MISSING from the transcript: $n" } }
          foreach ($n in $mustNot) { if (Has $n)        { $bad += "PRESENT but must not be: $n" } }
          # the probe must say "refused" or "undetermined", never nothing
          if (-not ((Has "this machine cannot read") -or
                    (Has "access to the fork was not checked"))) {
            $bad += "the fork probe reported neither a refusal nor an undetermined result"
          }
          if ($bad.Count -gt 0) {
            foreach ($b in $bad) { Write-Host "::error::run 2: $b" }
            exit 1
          }
          Write-Host "run 2: clone on disk and transcript agree; engine correctly reported missing"
          exit 0

      - name: "run 2: the fetched data cures the symptom that was reported"
        shell: cmd
        env:
          FLUBNF_HUB: ${{ runner.temp }}\flusight-hub
        run: |
          rem read vintages as the Data page does: the reported "Latest vintage: none" must be gone
          ".venv\Scripts\python" -c "from app.core.data import vintages; v = vintages(); print('archived truth vintages:', len(v)); print('latest vintage:', v[-1] if v else 'none'); raise SystemExit(0 if v else 1)"
          set CODE=%ERRORLEVEL%
          if not "%CODE%"=="0" echo ::error::the fetched hub yields no archived truth vintages, so the console would still open on "Latest vintage: none" - the exact symptom that was reported
          if not "%CODE%"=="0" exit /b 1
          exit /b 0

      - name: "run 3 of 5: re-run against the hub that now exists"
        shell: cmd
        timeout-minutes: 10
        env:
          FLUBNF_HUB: ${{ runner.temp }}\flusight-hub
          FLUBNF_NO_PROBE: "1"
        run: |
          set "LOG=%RUNNER_TEMP%\setup-run3.log"
          powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1 -NoPrompt > "%LOG%" 2>&1
          set CODE=%ERRORLEVEL%
          type "%LOG%"
          echo ---- setup.ps1 exit code: %CODE% ----
          if not "%CODE%"=="0" echo ::error::re-running setup.ps1 over an already-configured machine exited %CODE%. The script's first line claims it is idempotent, so a re-run has to be safe.
          if not "%CODE%"=="0" exit /b 1
          exit /b 0

      - name: "run 3: the existing clone is updated, not re-cloned or broken"
        shell: powershell
        run: |
          $path = Join-Path $env:RUNNER_TEMP "setup-run3.log"
          $raw = Get-Content $path -Raw
          if (-not $raw) { Write-Host "::error::run 3: the transcript at $path is empty, so setup.ps1 printed nothing at all"; exit 1 }
          $flat = $raw -replace '\s', ''
          function Has($needle) { $flat.Contains(($needle -replace '\s', '')) }
          $bad = @()
          $must = @(
            "hub present:",
            "engine venv not ready",
            "some externals missing"
          )
          $mustNot = @(
            "git clone failed",
            "exists but is not a git clone",
            "all externals present"
          )
          foreach ($n in $must)    { if (-not (Has $n)) { $bad += "MISSING from the transcript: $n" } }
          foreach ($n in $mustNot) { if (Has $n)        { $bad += "PRESENT but must not be: $n" } }
          # pull --ff-only on a shallow blobless sparse clone: a failure is only a warning.
          if (Has "hub updated (git pull --ff-only)") {
            Write-Host "run 3: the shallow blobless sparse clone updates cleanly"
          } elseif (Has "hub update skipped") {
            Write-Host "::warning::run 3: git pull --ff-only did not succeed against the shallow blobless sparse clone. The data on disk is still used, so this is not fatal, but the transcript above is the first real evidence about that command and should be read."
          } else {
            $bad += "neither an update nor a skipped update was reported for an existing hub"
          }
          if ($bad.Count -gt 0) {
            foreach ($b in $bad) { Write-Host "::error::run 3: $b" }
            exit 1
          }
          Write-Host "run 3: re-run over a configured machine is clean"
          exit 0

      - name: "run 3: the launcher configuration now points at the fetched data"
        shell: cmd
        run: |
          rem FluBNF.bat calls this file on every launch
          if not exist ".flubnf.env.cmd" echo ::error::.flubnf.env.cmd is gone after the later runs; FluBNF.bat would launch with no settings
          if not exist ".flubnf.env.cmd" exit /b 1
          call ".flubnf.env.cmd"
          if not defined FLUBNF_HUB echo ::error::.flubnf.env.cmd no longer sets FLUBNF_HUB
          if not defined FLUBNF_HUB exit /b 1
          echo FLUBNF_HUB=%FLUBNF_HUB%
          echo %FLUBNF_HUB%|findstr /e /i /c:"\flusight-hub" >nul
          set FOUND=%ERRORLEVEL%
          if not "%FOUND%"=="0" echo ::error::setup.ps1 fetched the data but .flubnf.env.cmd still names the old location, so the next launch would look in the wrong place
          if not "%FOUND%"=="0" exit /b 1
          exit /b 0

      # the field machine: a root-only sparse clone must be repaired
      - name: "run 4 of 5: a hub cloned BY HAND with --sparse"
        shell: cmd
        timeout-minutes: 15
        env:
          FLUBNF_HUB: ${{ runner.temp }}\byhand-hub
          FLUBNF_NO_PROBE: "1"
        run: |
          rem The command from the bug report, verbatim except for the path.
          git clone --filter=blob:none --sparse --depth 1 https://github.com/cdcepi/FluSight-forecast-hub "%RUNNER_TEMP%\byhand-hub"
          if errorlevel 1 echo ::error::run 4: the by-hand clone itself failed, so nothing below was actually tested
          if errorlevel 1 exit /b 1
          rem the premise: --sparse checks out the root only (else Repair-HubCone's reasoning is wrong)
          if exist "%RUNNER_TEMP%\byhand-hub\auxiliary-data" echo ::error::run 4: git clone --sparse produced auxiliary-data on this git version, so the premise of the whole repair is wrong. See the Repair-HubCone comment in setup.ps1.
          if exist "%RUNNER_TEMP%\byhand-hub\auxiliary-data" exit /b 1
          echo the by-hand clone holds only:
          dir /b "%RUNNER_TEMP%\byhand-hub"
          set "LOG=%RUNNER_TEMP%\setup-run4.log"
          powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1 -NoPrompt > "%LOG%" 2>&1
          set CODE=%ERRORLEVEL%
          type "%LOG%"
          echo ---- setup.ps1 exit code: %CODE% ----
          if not "%CODE%"=="0" echo ::error::run 4: setup.ps1 exited %CODE% over a by-hand sparse clone
          if not "%CODE%"=="0" exit /b 1
          exit /b 0

      - name: "run 4: the empty clone became one the console can read"
        shell: powershell
        env:
          FLUBNF_HUB: ${{ runner.temp }}\byhand-hub
        run: |
          $hub = $env:FLUBNF_HUB
          $bad = @()
          foreach ($d in @("auxiliary-data", "target-data",
                           "model-output\FluSight-baseline",
                           "model-output\FluSight-ensemble")) {
            if (-not (Test-Path (Join-Path $hub $d))) {
              $bad += "$d is still absent, so setup.ps1 did not widen the sparse cone and this machine is still the one in the field report"
            }
          }
          $raw = Get-Content (Join-Path $env:RUNNER_TEMP "setup-run4.log") -Raw
          if (-not $raw) { Write-Host "::error::run 4: the transcript is empty"; exit 1 }
          $flat = $raw -replace '\s', ''
          function Has($needle) { $flat.Contains(($needle -replace '\s', '')) }
          $must = @(
            "hub present:",
            "this clone does not contain",
            "sparse checkout widened"
          )
          $mustNot = @(
            "all externals present",
            "git clone failed",
            "hub data ready (sparse)"
          )
          foreach ($n in $must)    { if (-not (Has $n)) { $bad += "MISSING from the transcript: $n" } }
          foreach ($n in $mustNot) { if (Has $n)        { $bad += "PRESENT but must not be: $n" } }
          if ($bad.Count -gt 0) {
            foreach ($b in $bad) { Write-Host "::error::run 4: $b" }
            exit 1
          }
          Write-Host "run 4: a root-only sparse clone was repaired into a usable hub"
          exit 0

      - name: "run 4: and the console would no longer say 'Latest vintage: none'"
        shell: cmd
        env:
          FLUBNF_HUB: ${{ runner.temp }}\byhand-hub
        run: |
          ".venv\Scripts\python" -c "from app.core.data import vintages; v = vintages(); print('archived truth vintages:', len(v)); print('latest vintage:', v[-1] if v else 'none'); raise SystemExit(0 if v else 1)"
          if errorlevel 1 echo ::error::run 4: the repaired hub still yields no archived truth vintages, so the reported symptom survives the fix
          if errorlevel 1 exit /b 1
          rem and the doctor must agree
          ".venv\Scripts\python" -c "from flubnf.settings import check; m=[x[0] for x in check(verbose=True)]; print('missing:', m); raise SystemExit(1 if 'FLUBNF_HUB' in m else 0)"
          if errorlevel 1 echo ::error::run 4: the doctor still reports FLUBNF_HUB missing after the repair
          if errorlevel 1 exit /b 1
          exit /b 0

      # a pre-existing Documents checkout (no FLUBNF_HUB, no fetch): resolution only
      - name: "run 5 of 5: an existing checkout at the old Documents path"
        shell: cmd
        timeout-minutes: 10
        env:
          FLUBNF_NO_DATA: "1"
          FLUBNF_NO_PROBE: "1"
        run: |
          mkdir "%USERPROFILE%\Documents\GitHub\FluSight-forecast-hub" 2>nul
          if not exist "%USERPROFILE%\Documents\GitHub\FluSight-forecast-hub\." echo ::error::run 5: could not create the old-location directory, so nothing below was tested
          if not exist "%USERPROFILE%\Documents\GitHub\FluSight-forecast-hub\." exit /b 1
          set "LOG=%RUNNER_TEMP%\setup-run5.log"
          powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1 -NoPrompt > "%LOG%" 2>&1
          set CODE=%ERRORLEVEL%
          type "%LOG%"
          echo ---- setup.ps1 exit code: %CODE% ----
          if not "%CODE%"=="0" echo ::error::run 5: setup.ps1 exited %CODE% on a machine holding a checkout at the old location
          if not "%CODE%"=="0" exit /b 1
          exit /b 0

      - name: "run 5: the old checkout is reused, said out loud, and recorded"
        shell: powershell
        run: |
          $path = Join-Path $env:RUNNER_TEMP "setup-run5.log"
          $raw = Get-Content $path -Raw
          if (-not $raw) { Write-Host "::error::run 5: the transcript at $path is empty"; exit 1 }
          $flat = $raw -replace '\s', ''
          function Has($needle) { $flat.Contains(($needle -replace '\s', '')) }
          $bad = @()
          $must = @(
            "Reusing folders that are already on this machine",
            "Documents\GitHub\FluSight-forecast-hub",
            "Controlled Folder"
          )
          foreach ($n in $must) { if (-not (Has $n)) { $bad += "MISSING from the transcript: $n" } }
          # what the next launch will read
          $envCmd = Get-Content ".flubnf.env.cmd" -Raw
          if ($envCmd -notmatch [regex]::Escape("Documents\GitHub\FluSight-forecast-hub")) {
            $bad += ".flubnf.env.cmd does not point at the existing checkout, so a machine that worked before this change would stop finding its data"
          }
          if ($bad.Count -gt 0) {
            foreach ($b in $bad) { Write-Host "::error::run 5: $b" }
            exit 1
          }
          Write-Host "run 5: an existing checkout under Documents is reused where it stands"
          exit 0
