[project]
name = "flubnf"
version = "0.1.0"
description = "Mechanistic influenza forecasting for CDC FluSight: SIHRS in BNGL, fitted with PyBNF (particle filter + adaptive MCMC) on the bngsim engine"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pydantic",
    "rich",
    "pyyaml",
    "typer",
    "pymmwr",
    "requests",
]

[project.optional-dependencies]
app = ["fastapi", "uvicorn", "jinja2", "python-multipart", "plotly", "pywebview"]
dev = ["pytest", "httpx2"]
# The CovidHub ships its truth as a versioned parquet rather than one dated CSV
# per week, so the COVID vintage adapter needs a parquet engine. Kept out of the
# base dependencies: the influenza path reads CSV and must not grow a 36 MB
# wheel it never opens.
covid = ["pyarrow"]

[project.scripts]
flubnf = "flubnf.cli:app"

[tool.setuptools.packages.find]
include = ["flubnf*", "app*"]

[tool.pytest.ini_options]
addopts = "-q"
