[project]
name = "flubnf"
version = "1.1.0"
description = "Influenza forecasting console for CDC FluSight: the Oracle SIHRS (a BNGL model fitted by a PyBNF particle filter on bngsim) and the empirical Groundhog"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# Keep in step with CITATION.cff (and the version with flubnf/__init__.py and
# FluBNF.app/Contents/Info.plist).
authors = [
    { name = "Ely F. Miller", email = "efinn2019@gmail.com" },
]
keywords = ["influenza", "forecasting", "FluSight", "particle filter",
            "compartmental model", "rule-based modeling", "BNGL", "PyBNF"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy",
    "pandas",
    "rich",
    "typer",
]

# [project.*] sub-tables must follow the last plain [project] key, or TOML
# reads later keys into them (dependencies once became a URL entry).
[project.urls]
Homepage = "https://github.com/elyfmiller/flubnf"
Repository = "https://github.com/elyfmiller/flubnf"
Issues = "https://github.com/elyfmiller/flubnf/issues"
Release-notes = "https://github.com/elyfmiller/flubnf/blob/main/docs/archive/RELEASE-1.0.md"

[project.optional-dependencies]
app = ["fastapi", "uvicorn", "jinja2", "python-multipart", "plotly", "pywebview"]
# pyyaml: the hub metadata tests parse YAML; nothing at runtime does.
dev = ["pytest", "httpx2", "pyyaml"]

[project.scripts]
flubnf = "flubnf.cli:app"

[tool.setuptools.packages.find]
# scripts/ is not packaged: operational runners that need a full clone (hub,
# engine venv, BNG2.pl), and too generic a top-level name. Nothing in the
# wheel may import it.
include = ["flubnf*", "app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "app/tests"]
