data_inputs: "Weekly state-level laboratory-confirmed influenza hospital admissions from NHSN."
model_name: "FluBNF SIHRS particle filter"
model_abbr: "SIHRS"
model_version: "1.0.0"
designated_model: false
methods: "Sequential particle filter over an SIHRS compartmental model with a seasonal harmonic transmission rate, advanced one week at a time against NHSN hospitalization data."
methods_long: "A sequential Monte Carlo particle filter applied to an SIHRS compartmental model specified in BioNetGen language. Transmission carries a seasonal harmonic, and the filter is advanced one week at a time so each week's posterior conditions on all hospitalization data reported to that point rather than refitting the season from scratch. Particles are propagated with Liu-West jitter and resampled systematically when the effective sample size falls below threshold. This model is the mechanistic component of the FluBNF ensemble and is submitted undesignated, so that its standalone performance can be evaluated independently of the blend it contributes to without contributing a second highly correlated forecast to the hub ensemble."
ensemble_of_models: false
ensemble_of_hub_models: false
