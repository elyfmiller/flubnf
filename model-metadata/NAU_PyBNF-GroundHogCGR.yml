methods: "Latest admissions scaled by empirical quantiles of growth ratios at the same epiweek in earlier seasons, pooled across jurisdictions (own and similar-sized weeks favoured) with FluSurv-NET donors."
data_inputs: "Weekly state-level laboratory-confirmed influenza hospital admissions from NHSN, read from the hub's dated vintage archive, and weekly FluSurv-NET hospitalization rates from CDC via the Delphi Epidata API as an auxiliary donor stream."
methods_long: "The most recent reported admissions count for each jurisdiction, multiplied by empirical quantiles of the growth ratios y[t+h]/y[t] seen at calendar weeks within two MMWR epiweeks of the forecast origin in strictly earlier seasons, pooled across jurisdictions, per horizon, as a weighted empirical quantile function in which the jurisdiction's own past weeks carry half of the weight and every other jurisdiction's weeks share the other half, so each jurisdiction has its own forecast shape. Within each half, a donor week's weight falls with the distance on the log scale between its own count and the jurisdiction's newest count (a Gaussian kernel of width one in log counts), so similar-sized weeks carry the most weight and a donor week based on one or two admissions cannot set a large jurisdiction's tail; a class of 30 or more donor weeks that the weighting would leave with fewer than 30 effective donors takes equal weights instead. A second donor pool built the same way from FluSurv-NET hospitalization rates, shrunk to the admissions scale by a factor fitted on earlier seasons, is averaged in at fixed equal weight. Both donor banks are committed and digest-checked; the partial 2021-22 season is excluded (pre-registered). Uncertainty: the spread of the donor ratios; no coverage guarantee is claimed. Spatial correlation: none beyond the shared donor pool. On vintage replays of 2023-24 to 2025-26 the pooled relative WIS against the FluSight baseline is 0.642 (17,116 cells, a ratio of WIS sums, self-scored, FluSight's cell rule), with 50 and 95 percent coverage of 0.50 and 0.94; on the same cells the form without the size weighting, submitted in the third round, scored 0.660, and the pooled form submitted in the first two rounds of 2026-27 scored 0.670. When a jurisdiction's newest week reads 0 the forecaster chooses, per jurisdiction and recorded with the run, whether the Groundhog abstains, anchors on the mean of the last four weeks, carries the last positive week forward, or blends the two; the forecaster may also set aside a jurisdiction's newest one or two weeks when they read 0 or collapse, and the forecast then starts from the week before. Replaces the empirical half of this team's earlier LosAlamos_NAU-CModel_Flu entry."
ensemble_of_models: false
ensemble_of_hub_models: false
