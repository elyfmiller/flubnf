methods: "Sequential particle filter over an SIHRS compartmental model with seasonal transmission, parameterised from past seasons, submitted as a standalone model."
data_inputs: "Weekly state-level laboratory-confirmed influenza hospital admissions from NHSN, read from the hub's dated vintage archive."
methods_long: "PENDING: the description of the Oracle parameterisation, which carries information from past seasons into the real-time mechanistic fit, is being written by the team building it and must replace this paragraph before the card is submitted to the hub. What follows describes the particle filter as it runs today. This team submitted through 2026-09 as LosAlamos_NAU-CModel_Flu, an equal-weight blend of this model with a calendar analogue; from the 2026-27 season the two are submitted separately under NAU_PyBNF, this model and NAU_PyBNF-GroundHogCGR, and nothing is blended. The model is SIHRS (susceptible, infected, hospitalized, recovered, with waning immunity) written in BNGL, with an annual harmonic on the transmission rate. A sequential particle filter carries 10,000 candidate epidemics per jurisdiction and reweights them against each week's reported admissions under a negative-binomial observation model whose dispersion is itself fitted; five parameters are estimated per jurisdiction and per week. Forecasts freeze transmission forward from the fit origin and propagate the particle cloud, so the predictive distribution reflects both parameter and observation uncertainty. Retrospective replays on vintage data across the 2023-24, 2024-25 and 2025-26 seasons give the filter alone a pooled relative WIS of 0.821 (a ratio of WIS sums on 15,460 shared cells, self-scored with this project's frozen cell rule, not the dashboard's pairwise scaled relative WIS) against the CDC FluSight-baseline, beating the baseline in each season."
ensemble_of_models: false
