designated_model: true
methods: "Sequential particle filter over an SIHRS compartmental model with seasonal transmission; each forecast path's growth is then blended with one calendar-matched past-season admission growth path; submitted as a standalone model."
data_inputs: "Weekly state-level laboratory-confirmed influenza hospital admissions from NHSN, read from the hub's dated vintage archive."
methods_long: "The model is SIHRS (susceptible, infected, hospitalized, recovered, with waning immunity) written in BNGL, with an annual harmonic on the transmission rate. A sequential particle filter carries 10,000 candidate epidemics per jurisdiction and reweights them against each week's reported admissions under a negative-binomial observation model whose dispersion is itself fitted; five parameters are estimated per jurisdiction and per week, and forecasts propagate the particle cloud forward from the fit origin. The Oracle step then acts on the filter's stored forward samples and nothing else: each sample path's growth over the four forecast weeks is replaced by the geometric mean, at weight one half, of the filter's own origin growth and one donor growth path drawn at random from a calendar-matched bank of past seasons' NHSN admission growth (strictly earlier seasons, within two epiweeks of the forecast date, pooled across jurisdictions, a count floor of 10 on the donor's origin window), propagated in closed form from the filter's own state, so the stored spread rides on the new median path and the donors' spread of level is added on top. The donor bank is rebuilt from the hub's vintage each week; a week with fewer than two donor seasons is the filter unchanged. The step is fully specified by a frozen pre-registration (sha256 67c9fa49a195908312f34ca783b21d85377759309df14461f86fbfd54d30c56f), the weight and every constant fixed before any score was read, and the 2026-27 season is its first prospective test. On the pre-registered screen over the stored 2024-25 and 2025-26 forecasts (grid J15, 9,279 cells where both stored members scored), the step lowered the filter's relative WIS against the FluSight baseline from 0.813 to 0.741 (0.819 to 0.761 over the three seasons, the 2023-24 season being the filter unchanged), self-scored with this project's frozen cell rule as a ratio of WIS sums, not the dashboard's pairwise scaled relative WIS. This team submitted through 2026-09 as LosAlamos_NAU-CModel_Flu, an equal-weight blend of the filter with a calendar analogue; from the 2026-27 season the two are submitted separately under NAU_PyBNF, this model and NAU_PyBNF-GroundHogCGR, and nothing is blended. Retrospective replays of the filter alone on vintage data across the 2023-24, 2024-25 and 2025-26 seasons give a pooled relative WIS of 0.821 (15,460 shared cells, the same cell rule) against the CDC FluSight-baseline, beating the baseline in each season."
ensemble_of_models: false
