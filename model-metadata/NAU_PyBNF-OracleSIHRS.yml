methods: "SIHRS compartment model fitted weekly by the Liu-West filter; each forecast path's growth is blended (filter weight 1/4 from 2026-10-17) with a past-season NHSN or FluSurv-NET donor growth path."
data_inputs: "Weekly state-level laboratory-confirmed influenza hospital admissions from NHSN, read from the hub's dated vintage archive, both for the weekly fit and for half of the donor growth paths of earlier seasons; weekly FluSurv-NET laboratory-confirmed influenza hospitalization rates (Delphi epidata), from a committed, digest-checked bank, for the other half."
methods_long: "The SIHRS compartment model (BNGL, with an annual harmonic on transmission) is fitted each week by the Liu-West filter (a particle filter, in a PyBNF fork on bngsim) to each jurisdiction's NHSN admissions from the season start (August 1): 10,000 candidate epidemics, a fitted negative-binomial observation model and five parameters per jurisdiction. The season-start infected fraction is set from the jurisdiction's first observed week and a pinned admissions-per-infection ratio: an assumed 18% seasonal infection attack rate against the jurisdiction's expected season total of admissions (the median per-capita total of its completed past seasons in the same vintage) while the season-to-date count is below a quarter of that total, and against the season-to-date count from then on (from the 2026-10-17 round; before it, the season-to-date count throughout). The Oracle step then replaces each forecast sample path's growth by the geometric mean, at weight one half, of the filter's growth and one donor growth path from strictly earlier seasons at the same calendar week (within two epiweeks of the forecast date), propagated from the filter's own state. From the 2026-10-17 round the submitted weight is one quarter on the filter's growth (one half before); each run records the weight it used. The donor bank is the Groundhog's own: past-season NHSN admission growth, rebuilt each week from the hub's dated vintage archive, and FluSurv-NET hospitalization-rate growth from a committed, digest-checked bank, mixed half and half per sample path. Each path draws from either stream with probability one half; an admissions donor needs at least 10 admissions, and a stream needs two donor seasons and 30 paths, else the filter is used unchanged. Uncertainty: the quantiles are empirical quantiles of the blended samples, carrying the filter's spread and the donors'. Spatial correlation: none; jurisdictions are fitted independently and share only the donor pool. Five seeds are run and the first is submitted. A newest week that reads 0 is fitted as the count it is; the forecaster may set aside a jurisdiction's newest one or two weeks when they read 0 or collapse, recorded with the run, and the fit then ends at the week before with every horizon still counted from the forecast date. Replaces this team's earlier LosAlamos_NAU-CModel_Flu entry."
ensemble_of_models: false
