designated_model: true
methods: "SIHRS compartment model fitted weekly by a particle filter; each forecast path's growth is blended 50/50 with an NHSN or FluSurv-NET donor growth path from an earlier season at the same calendar week."
data_inputs: "Weekly state-level laboratory-confirmed influenza hospital admissions from NHSN, read from the hub's dated vintage archive, both for the weekly fit and for half of the donor growth paths of earlier seasons; weekly FluSurv-NET laboratory-confirmed influenza hospitalization rates (Delphi epidata), from a committed, digest-checked bank, for the other half."
methods_long: "The Oracle SIHRS is a mechanistic forecast. It is built on the SIHRS compartment model (susceptible, infected, hospitalized, recovered, with waning immunity back to susceptible) written in BNGL, with an annual harmonic on the transmission rate. Each week a sequential particle filter (a fork of PyBNF, on the bngsim engine) fits the model to each jurisdiction's weekly NHSN admissions from the season start (August 1) through the forecast date's data vintage: 10,000 candidate epidemics per jurisdiction are reweighted against each week's reported admissions under a negative-binomial observation model whose dispersion is itself fitted, five parameters are estimated per jurisdiction, and the particle cloud propagated forward from the fit origin gives the filter's forecast sample paths. The Oracle step then acts on those stored forward samples and nothing else: each sample path draws one donor growth path from strictly earlier seasons at the same calendar week (within two epiweeks of the forecast date, pooled across jurisdictions), and its growth over the four forecast weeks is replaced by the geometric mean, at weight one half, of the filter's own growth at the forecast origin and the donor's, propagated in closed form from the filter's own state. The donor bank is the Groundhog's own: past-season NHSN admission growth, rebuilt each week from the hub's dated vintage archive, and FluSurv-NET hospitalization-rate growth from a committed, digest-checked bank, mixed half and half per sample path. An admissions donor path needs at least 10 admissions around its donor week, and that stream needs two donor seasons and 30 paths; the FluSurv-NET stream's growth is scaled so its spread matches the admissions stream's (the Groundhog's shrink, refitted each week) and it needs 30 paths; each sample path draws from either stream with probability one half, from the one that qualifies when only one does, and a week where neither qualifies is the filter unchanged (in 2023-24, with one admissible NHSN donor season, the FluSurv-NET stream supplies every donor). The same calendar-donor principle drives this team's Groundhog, which applies donor growth ratios to the last observed count; this model applies donor growth to the mechanistic state. Uncertainty: the submitted quantiles are the empirical quantiles of the transformed samples, so the filter's own spread (parameter and observation uncertainty carried by the particle cloud) rides on the blended path and the donors' spread of growth is added on top; one donor per sample path keeps both. Spatial correlation: jurisdictions are fitted independently and none is modelled; only the donor pool is shared across jurisdictions. The step is fully specified by a frozen pre-registration (sha256 67c9fa49a195908312f34ca783b21d85377759309df14461f86fbfd54d30c56f) and its donor bank by a second (sha256 2ce3564622296f490a435b773a3b34d431d889b3e0d4fe4b32ff6aeb8ede9249), the weight and every constant frozen before the step was scored, the method family having been screened on the same seasons first; five seeds are logged each week and the first is submitted. On the stored 2024-25 and 2025-26 forecasts (9,279 cells where the filter scored), the step lowered the filter's relative WIS against the FluSight baseline from 0.813 to 0.731 (0.794 to 0.697 and 0.843 to 0.781 by season; 0.840 to 0.767 in 2023-24; 0.819 to 0.738 over the three seasons), self-scored with this project's cell rule as a ratio of WIS sums, not the dashboard's pairwise scaled relative WIS. The choice of this donor bank over admissions growth alone was the team's decision on a screen that did not resolve it (0.731 against 0.741 on the same cells, an interval including zero). That is a frozen-specification replication on forecasts the method family had been screened on, and the 2026-27 season is its prospective test. Retrospective replays of the filter alone on vintage data across the 2023-24, 2024-25 and 2025-26 seasons give a pooled relative WIS of 0.821 (15,460 shared cells, the same cell rule), beating the baseline in each season. This team submitted through 2026-09 as LosAlamos_NAU-CModel_Flu, an equal-weight blend of the filter with a calendar analogue; from the 2026-27 season this model and NAU_PyBNF-GroundHogCGR are submitted separately under NAU_PyBNF, and nothing is blended between them."
