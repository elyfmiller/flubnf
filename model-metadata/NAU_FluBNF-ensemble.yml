data_inputs: "Weekly state-level laboratory-confirmed influenza hospital admissions from NHSN."
model_name: "FluBNF ensemble"
model_abbr: "ensemble"
model_version: "1.0.0"
designated_model: true
methods: "Equal-weight quantile average of two members: a sequential particle filter over an SIHRS compartmental model, and a calendar-matched analogue of growth ratios from prior seasons."
methods_long: "FluBNF combines two members by equal-weight quantile averaging (Vincentization). The first member is a sequential particle filter applied to an SIHRS compartmental model whose transmission rate carries a seasonal harmonic; the filter is advanced one week at a time so that each week's posterior conditions on all hospitalization data reported to that point. The second member is a calendar analogue, which scales a state's most recent observation by the empirical distribution of growth ratios observed at the same point in the calendar in strictly earlier seasons, pooled across jurisdictions and computed independently at each horizon. The 2021-22 season is excluded from the analogue's donor pool because it peaked in April 2022 and is held in the vintage archive only as a partial tail, which makes it calendar-inverted relative to every other season. The two members are combined at fixed equal weights. The weights are not fitted; a leave-one-season-out fitted weighting was measured and scored worse than the equal-weight blend."
ensemble_of_models: true
ensemble_of_hub_models: false
